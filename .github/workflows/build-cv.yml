name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: curriculum_vitae.tex
          working_directory: cv

      - name: Publish generated PDF
        run: cp cv/curriculum_vitae.pdf assets/files/curriculum_vitae.pdf

      - name: Commit updated PDF
        run: |
          if git diff --quiet -- assets/files/curriculum_vitae.pdf; then
            echo "The published CV is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/files/curriculum_vitae.pdf
          git commit -m "Build CV from LaTeX [skip ci]"
          git push
